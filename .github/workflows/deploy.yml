name: Deploy TacFit to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          # Without these the GH Pages bundle falls back to the placeholder
          # Supabase client (placeholder.supabase.co → DNS error on login).
          # The anon key is PUBLIC by design — it ships in every served JS
          # bundle (view-source on the Vercel site shows it); row-level
          # security is what protects the data, not this key.
          VITE_SUPABASE_URL: https://onzuguqbcdfblxdsekiz.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uenVndXFiY2RmYmx4ZHNla2l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1Mjk1NTUsImV4cCI6MjA5OTEwNTU1NX0.Oh4W8-LDVtiGZyzVvViDmWShvWR4mwHyARawPQ5UyFs

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - id: deploy
        uses: actions/deploy-pages@v4
