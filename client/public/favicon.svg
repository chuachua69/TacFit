<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark tactical background -->
  <rect width="32" height="32" rx="6" fill="#0d1109"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#c8a040" stroke-width="1.5"/>
  <!-- Inner dot -->
  <circle cx="16" cy="16" r="2.5" fill="#c8a040"/>
  <!-- Crosshair lines - top -->
  <line x1="16" y1="3" x2="16" y2="9" stroke="#c8a040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- bottom -->
  <line x1="16" y1="23" x2="16" y2="29" stroke="#c8a040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- left -->
  <line x1="3" y1="16" x2="9" y2="16" stroke="#c8a040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- right -->
  <line x1="23" y1="16" x2="29" y2="16" stroke="#c8a040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- subtle inner ring -->
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="#c8a040" stroke-width="0.8" opacity="0.5"/>
</svg>
